<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 480" font-family="ui-monospace, Menlo, monospace">
  <rect width="800" height="480" fill="#020617"/>
  <defs>
    <linearGradient id="coneFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="sweepFill" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#D4A949" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#D4A949" stop-opacity="0.05"/>
    </linearGradient>
  </defs>
  <!-- Ground plane -->
  <line x1="40" y1="360" x2="760" y2="360" stroke="#1E293B" stroke-width="1"/>
  <line x1="80" y1="360" x2="80" y2="366" stroke="#1E293B"/>
  <line x1="160" y1="360" x2="160" y2="366" stroke="#1E293B"/>
  <line x1="240" y1="360" x2="240" y2="366" stroke="#1E293B"/>
  <line x1="320" y1="360" x2="320" y2="366" stroke="#1E293B"/>
  <line x1="400" y1="360" x2="400" y2="366" stroke="#1E293B"/>
  <line x1="480" y1="360" x2="480" y2="366" stroke="#1E293B"/>
  <line x1="560" y1="360" x2="560" y2="366" stroke="#1E293B"/>
  <line x1="640" y1="360" x2="640" y2="366" stroke="#1E293B"/>
  <line x1="720" y1="360" x2="720" y2="366" stroke="#1E293B"/>
  <!-- Static cone (half-cone width = tan(30°) * 270 ≈ 156) -->
  <path d="M 400 90 L 244 360 L 556 360 Z" fill="url(#coneFill)" stroke="#38BDF8" stroke-opacity="0.5" stroke-width="1"/>
  <!-- Nadir line -->
  <line x1="400" y1="90" x2="400" y2="360" stroke="#1E293B" stroke-width="1" stroke-dasharray="3 4"/>
  <!-- Sweep wedge (snapshot at 0°, frozen) -->
  <path d="M 400 90 L 372 360 L 428 360 Z" fill="url(#sweepFill)" stroke="#D4A949" stroke-opacity="0.9" stroke-width="1.2"/>
  <!-- Cone edge labels -->
  <text x="238" y="354" font-size="10" fill="#94A3B8" text-anchor="end">−30°</text>
  <text x="562" y="354" font-size="10" fill="#94A3B8">+30°</text>
  <text x="400" y="382" font-size="10" fill="#94A3B8" text-anchor="middle">nadir</text>
  <!-- Targets -->
  <circle cx="314" cy="354" r="9" fill="#D4A949" fill-opacity="0.18"/>
  <circle cx="314" cy="354" r="3.5" fill="#D4A949"/>
  <text x="314" y="340" font-size="10" fill="#F1F5F9" text-anchor="middle">T-A</text>
  <circle cx="408" cy="342" r="9" fill="#D4A949" fill-opacity="0.18"/>
  <circle cx="408" cy="342" r="3.5" fill="#D4A949"/>
  <text x="408" y="328" font-size="10" fill="#F1F5F9" text-anchor="middle">T-B</text>
  <circle cx="501" cy="356" r="9" fill="#D4A949" fill-opacity="0.18"/>
  <circle cx="501" cy="356" r="3.5" fill="#D4A949"/>
  <text x="501" y="342" font-size="10" fill="#F1F5F9" text-anchor="middle">T-C</text>
  <!-- Satellite -->
  <g transform="translate(378 68)">
    <rect x="14" y="14" width="16" height="16" fill="#1E293B" stroke="#38BDF8" stroke-width="1.3" rx="2"/>
    <rect x="-4" y="18" width="14" height="8" fill="none" stroke="#38BDF8" stroke-width="1"/>
    <rect x="34" y="18" width="14" height="8" fill="none" stroke="#38BDF8" stroke-width="1"/>
    <line x1="22" y1="14" x2="22" y2="6" stroke="#38BDF8" stroke-width="1"/>
    <circle cx="22" cy="6" r="2" fill="#38BDF8"/>
  </g>
  <!-- Title -->
  <text x="400" y="50" font-size="11" fill="#F1F5F9" text-anchor="middle">±30° off-nadir slew envelope</text>
  <text x="400" y="450" font-size="9" fill="#94A3B8" text-anchor="middle">Snapshot only — the wedge sweeps left↔right at 3.4s ease-in-out in the live modal.</text>
</svg>
